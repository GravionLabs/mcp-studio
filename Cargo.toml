[workspace]
resolver = "2"
members = [
  "crates/mcp-studio-core",
  "crates/mcp-studio-llm",
  "crates/mcp-studio-proxy",
  "crates/mcp-studio-testserver",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jerome Kaufmann"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
