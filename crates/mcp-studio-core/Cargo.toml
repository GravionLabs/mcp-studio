[package]
name = "mcp-studio-core"
description = "MCP Studio domain core: registry, sessions, recording, metering. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyring = "4"
rmcp = { version = "3.5", features = ["client", "server", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde.workspace = true
serde_json.workspace = true
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
tokio.workspace = true
url = "2"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
mcp-studio-testserver = { path = "../mcp-studio-testserver" }
tempfile = "3.27.0"
