[package]
name = "mcp-studio-core"
description = "MCP Studio domain core: registry, sessions, recording, metering. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio-util = "0.7"
http = "1"
keyring = "4"
rmcp = { version = "3.5", features = ["client", "server", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
tokio.workspace = true
url = "2"
uuid = { version = "1.26.1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1.92"
which = "8"
azure_core = "1"
azure_identity = "1"
sse-stream = "0.2"
serde_yaml_ng = "0.10.0"

[dev-dependencies]
mcp-studio-testserver = { path = "../mcp-studio-testserver" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27.0"
