[package]
name = "mcp-studio-testserver"
description = "Deterministic reference MCP server (stdio and Streamable HTTP) used by integration tests."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde.workspace = true
tokio.workspace = true
tokio-util = "0.7"
