[package]
name = "mcp-studio-llm"
description = "LLM provider abstraction for MCP Studio flows and AI features."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mcp-studio-core = { path = "../mcp-studio-core" }
