[package]
name = "mcp-studio-proxy"
description = "Stdio bridge that lets an MCP client talk to a server through MCP Studio, which records the traffic."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "macros", "rt-multi-thread"] }
