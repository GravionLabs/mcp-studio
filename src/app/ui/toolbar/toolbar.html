<header class="toolbar">
  <strong class="brand">MCP Studio</strong>
  <span class="spacer"></span>
  <label class="env">
    <span class="muted">Environment</span>
    <select [value]="environments.activeId() ?? ''" (change)="select($event)">
      <option value="">None</option>
      @for (environment of environments.environments(); track environment.id) {
      <option [value]="environment.id" [selected]="environment.id === environments.activeId()">
        {{ environment.name }}
      </option>
      }
    </select>
  </label>
  <a class="manage" routerLink="/environments">Manage</a>
  <a class="manage" routerLink="/history">History</a>
  <a class="manage" routerLink="/flows">Flows</a>
  <a class="manage" routerLink="/suites">Suites</a>
  <a class="manage" routerLink="/compare">Compare</a>
  <a class="manage" routerLink="/providers">Providers</a>
  <a class="manage" routerLink="/traces">Traces</a>
  <a class="manage" routerLink="/prices">Prices</a>
  <a class="manage" routerLink="/settings">Settings</a>
  <button type="button" class="ghost" (click)="layout.toggleInspector()">
    {{ layout.inspectorOpen() ? "Hide inspector" : "Show inspector" }}
  </button>
  <button
    type="button"
    class="ghost"
    (click)="theme.toggle()"
    [attr.aria-label]="'Switch to ' + (theme.isDark() ? 'light' : 'dark') + ' theme'"
  >
    {{ theme.isDark() ? "☀ Light" : "☾ Dark" }}
  </button>
</header>
