<div class="shell">
  <app-toolbar />
  <div class="columns">
    <aside class="sidebar" [style.width.px]="layout.sidebarWidth()">
      <app-sidebar />
    </aside>
    <div
      [appResizeHandle]="layout.sidebarWidth()"
      edge="right"
      (resized)="layout.setSidebarWidth($event)"
    ></div>

    <main class="workspace">
      <app-tabs />
      <div class="content" [appTabPanel]="tabs.activeId() ?? 'none'" tabPanelGroup="workspace">
        <router-outlet />
      </div>
    </main>

    @if (layout.inspectorOpen()) {
    <div
      [appResizeHandle]="layout.inspectorWidth()"
      edge="left"
      (resized)="layout.setInspectorWidth($event)"
    ></div>
    <aside class="inspector" [style.width.px]="layout.inspectorWidth()">
      <app-inspector-panel />
    </aside>
    }
  </div>
  <app-status-bar />
  <app-toasts />
  <app-dialog-host />
  <app-flow-confirmations />
  <app-client-requests />
</div>
