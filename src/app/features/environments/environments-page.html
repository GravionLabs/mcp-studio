<div class="page">
  <aside class="list">
    <button type="button" (click)="select(null)">+ New environment</button>
    <ul>
      @for (environment of store.environments(); track environment.id) {
      <li>
        <button
          type="button"
          class="ghost item"
          [class.selected]="environment.id === selectedId()"
          (click)="select(environment.id)"
        >
          {{ environment.name }} @if (environment.id === store.activeId()) {
          <span class="badge">active</span>
          }
        </button>
      </li>
      }
    </ul>
  </aside>

  <form class="editor" (submit)="$event.preventDefault(); save()">
    <h2>{{ selectedId() ? "Edit environment" : "New environment" }}</h2>
    <label>
      <span>Name</span>
      <input [value]="name()" (input)="name.set(text($event))" placeholder="dev" />
    </label>
    <div class="group">
      <span
        >Variables — use as <code>{{ "{{name}}" }}</code> in arguments, headers, and tool
        inputs</span
      >
      <app-key-value-editor [rows]="rows()" keyPlaceholder="name" (rowsChange)="rows.set($event)" />
    </div>
    <div class="actions">
      <button type="submit" class="primary">Save</button>
      @if (selectedId(); as id) {
      <button type="button" (click)="store.setActive(id === store.activeId() ? null : id)">
        {{ id === store.activeId() ? "Deactivate" : "Make active" }}
      </button>
      } @if (canDelete()) {
      <button type="button" class="danger" (click)="remove()">Delete</button>
      }
    </div>
  </form>
</div>
