<form class="form" (submit)="$event.preventDefault(); save()">
  <h2>{{ editing() ? "Edit server" : "New server" }}</h2>

  <label>
    <span>Name</span>
    <input [value]="form().name" (input)="patch({ name: text($event) })" placeholder="My server" />
  </label>

  <fieldset class="transport">
    <legend>Transport</legend>
    <label class="inline">
      <input
        type="radio"
        name="transport"
        [checked]="form().transport === 'stdio'"
        (change)="setTransport('stdio')"
      />
      stdio (local process)
    </label>
    <label class="inline">
      <input
        type="radio"
        name="transport"
        [checked]="form().transport === 'http'"
        (change)="setTransport('http')"
      />
      Streamable HTTP
    </label>
  </fieldset>

  @if (form().transport === "stdio") {
    <label>
      <span>Command</span>
      <input
        class="mono"
        [value]="form().command"
        (input)="patch({ command: text($event) })"
        placeholder="npx"
      />
    </label>
    <label>
      <span>Arguments</span>
      <input
        class="mono"
        [value]="form().args"
        (input)="patch({ args: text($event) })"
        placeholder="-y @modelcontextprotocol/server-everything"
      />
    </label>
    <label>
      <span>Working directory</span>
      <input
        class="mono"
        [value]="form().cwd"
        (input)="patch({ cwd: text($event) })"
        placeholder="optional"
      />
    </label>
    <div class="group">
      <span>Environment variables</span>
      <app-key-value-editor [rows]="form().env" (rowsChange)="patch({ env: $event })" />
    </div>
  } @else {
    <label>
      <span>URL</span>
      <input
        class="mono"
        [value]="form().url"
        (input)="patch({ url: text($event) })"
        placeholder="https://example.com/mcp"
      />
    </label>
    <label class="inline">
      <input type="checkbox" [checked]="form().oauth" (change)="patch({ oauth: !form().oauth })" />
      Uses OAuth 2.1 (sign in with the browser; tokens are kept in the OS keyring)
    </label>
    <div class="group">
      <span>Headers</span>
      <app-key-value-editor
        [rows]="form().headers"
        keyPlaceholder="Header"
        (rowsChange)="patch({ headers: $event })"
      />
    </div>
  }

  <label>
    <span>Tags</span>
    <input
      [value]="form().tags"
      (input)="patch({ tags: text($event) })"
      placeholder="comma separated"
    />
  </label>

  @if (submitted() && problems().length > 0) {
    <ul class="problems" role="alert">
      @for (problem of problems(); track problem) {
        <li>{{ problem }}</li>
      }
    </ul>
  }

  <div class="actions">
    <button type="submit" class="primary" [disabled]="saving()">Save</button>
    <button type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
